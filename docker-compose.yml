# Services de developpement.
# redis, meilisearch et minio ont ete retires le 1er septembre 2026 : ils etaient
# declares mais jamais utilises par le code (REBUILD.md T2.6).
# Sur cette machine, Postgres tourne via Homebrew (postgresql@16) et non via Docker,
# qui n'est pas installe. Ce fichier reste la pour une machine equipee de Docker.
version: "3.9"

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mif-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mif_user
      POSTGRES_PASSWORD: mif_password
      POSTGRES_DB: madeinfrance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mif_user -d madeinfrance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis Cache
  # ===========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mif-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  postgres_data:

networks:
  default:
    name: mif-network
