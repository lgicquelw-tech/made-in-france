# Intégration continue (REBUILD.md T6.6).
#
# Un seul travail, en séquence, du moins cher au plus cher : installer, générer le client
# Prisma, vérifier les types, linter, tests unitaires, tests d'intégration sur une vraie
# base PostgreSQL, construire, puis jouer les parcours navigateur sur ce build. Le premier échec arrête tout — un build de trois
# minutes ne sert à rien si les types ne passent pas.
#
# Pourquoi le build est dans la liste : il a échoué pendant sept mois sans que personne
# ne le sache, parce que le mode développement ne le signale pas (REBUILD.md, phase 4).
#
# La base est celle du service `postgres` ci-dessous : elle naît vide, reçoit les
# migrations par `prisma migrate deploy` (lancé par les tests d'intégration), et meurt
# avec le travail. Aucun secret réel n'est nécessaire — les valeurs ci-dessous sont
# factices et le disent.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: types · lint · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mif_user
          POSTGRES_PASSWORD: mif_password
          POSTGRES_DB: madeinfrance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mif_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Une seule base en CI, déjà nommée `_test` : les tests d'intégration l'acceptent
      # telle quelle. Ne PAS définir DATABASE_URL_TEST à la même valeur — le garde-fou
      # « identique à DATABASE_URL » refuserait de démarrer. Il l'a fait, au premier
      # passage : c'est sa raison d'être, pas un défaut.
      DATABASE_URL: postgresql://mif_user:mif_password@localhost:5432/madeinfrance_test?schema=public
      NEXTAUTH_SECRET: secret-factice-pour-la-ci-uniquement
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: pnpm (version épinglée par packageManager)
        uses: pnpm/action-setup@v4

      - name: Node (version épinglée par .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer
        run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm db:generate

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests unitaires
        run: pnpm test

      - name: Tests d'intégration (vraie base)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # Les parcours navigateur tournent sur `next start`, donc sur le build ci-dessus :
      # on teste ce qui serait déployé, pas le mode développement.
      - name: Navigateur Playwright
        run: pnpm --filter @mif/web exec playwright install --with-deps chromium

      - name: Parcours navigateur
        run: pnpm test:e2e

      - name: Traces des parcours en échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
